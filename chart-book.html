<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пять вариантов стакана</title>
<style>
  body { margin:0; background:#0d1117; color:#e6edf3; font-family:sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  h1 { font-size:20px; }
  p { color:#8b949e; }
  figure { margin:0 0 28px; }
  img { width:100%; border-radius:10px; border:1px solid #30363d; background:#161b22; }
  figcaption { margin-top:8px; }
  b { color:#d4a017; }
</style>
</head>
<body>
<main>
  <h1>График тот же. Меняется место стакана.</h1>
  <p>Картинки — раскладка, не живые цены.</p>
  <figure>
    <img src="https://raw.githubusercontent.com/Foxtel95/terminal-maket/main/chart-book/1-kolonka.jpg" alt="Колонка справа">
    <figcaption><b>1. Колонка справа.</b> Список, график и лестница стакана.</figcaption>
  </figure>
  <figure>
    <img src="https://raw.githubusercontent.com/Foxtel95/terminal-maket/main/chart-book/2-kartochka.jpg" alt="Карточка поверх">
    <figcaption><b>2. Карточка поверх графика.</b> Свечи на весь экран, стакан у правого края.</figcaption>
  </figure>
  <figure>
    <img src="https://raw.githubusercontent.com/Foxtel95/terminal-maket/main/chart-book/3-glubina.jpg" alt="Глубина снизу">
    <figcaption><b>3. Глубина под графиком.</b> Покупки влево, продажи вправо.</figcaption>
  </figure>
  <figure>
    <img src="https://raw.githubusercontent.com/Foxtel95/terminal-maket/main/chart-book/4-smysl.jpg" alt="Стакан и смысл">
    <figcaption><b>4. Стакан и три строки смысла.</b> Лестница и короткое объяснение под ней.</figcaption>
  </figure>
  <figure>
    <img src="https://raw.githubusercontent.com/Foxtel95/terminal-maket/main/chart-book/5-polosa.jpg" alt="Узкая полоса">
    <figcaption><b>5. Узкая полоса.</b> График почти не сжат, справа только перевес, снизу спред.</figcaption>
  </figure>
</main>
</body>
</html>
